name: Release

# Builds every release artifact and publishes a GitHub release.
#   - push a tag `vX.Y.Z` (the version must match `workspace.package.version`), or
#   - run manually (Actions → Release → Run workflow) with a tag; the tag is created
#     at the selected commit if it does not exist yet.
#   - push a `release/**` branch for a dry run: everything is built and uploaded as
#     workflow artifacts, nothing is published, and nothing is signed or notarized.
#
# Job layout (docs/RELEASING.md, "Trust boundaries"):
#   * Build and package jobs hold NO secrets. They are the only jobs that run third-party downloads
#     (rust toolchain, cargo-about, appimagetool, choco, WiX, ...).
#   * Signing and publishing jobs hold the secrets and run no third-party downloads: only this
#     repository's scripts, GitHub's own artifact actions, preinstalled tools and distro packages
#     (minisign, rpm). Exceptions, both hash-pinned: the Azure signing client (a NuGet package that
#     signtool loads, see scripts/sign-windows.ps1) and wingetcreate in the winget job.
#   * Those jobs declare `environment: release`. Create that environment with required reviewers and
#     move the secrets there (docs/RELEASING.md). With no protection rules, or when the environment
#     does not exist yet (GitHub creates it on first use), the jobs simply run. Runs that cannot sign
#     (dry runs) use the unprotected `release-preview` environment, which never holds secrets, so
#     they never wait for an approval.
#
# Signing is optional and driven entirely by secrets (docs/RELEASING.md lists them):
#   macOS    MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD [, MACOS_SIGNING_IDENTITY]
#            + APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID  (notarization)
#   Windows  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#            AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE            (Azure Artifact Signing), or
#            WINDOWS_CERTIFICATE_PFX_BASE64, WINDOWS_CERTIFICATE_PASSWORD   (certificate file)
#   Linux    LINUX_GPG_PRIVATE_KEY_BASE64 [, LINUX_GPG_PASSPHRASE]
#   All      UPDATE_SIGNING_KEY [, UPDATE_SIGNING_KEY_PASSWORD]      (minisign signature of SHA256SUMS.txt)
#   Package managers (optional pushes)   HOMEBREW_TAP_TOKEN, WINGET_TOKEN
#   Variable (not secret, optional)      ARTIFACT_SIGNING_CLIENT_SHA256 (pins the Azure signing client)
# Without a secret the matching step is skipped and that platform ships unsigned, clearly labelled
# in the release notes. The workflow is green either way. Secrets cannot be tested in `if:`
# expressions, so every signing job maps them to environment variables in a "Signing credentials"
# step that publishes `enabled=true|false` as a step output.
#
# Third-party actions are pinned by full commit SHA with the version in a trailing comment.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
      dry_run:
        description: "Build everything but publish nothing (like a release/** branch push)"
        type: boolean
        default: false
      sign_dry_run:
        description: "In a dry run, still sign and notarize (uses signing quota; off by default)"
        type: boolean
        default: false

# Jobs get read access only; the publish job asks for write access itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Pinned compiler: bump deliberately and fix new clippy lints in the same commit.
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # appimagetool is pinned to a tagged release and verified by SHA-256 (never `continuous`).
  # To bump: download both assets from the new release, run sha256sum, update all three values.
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256_X86_64: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  APPIMAGETOOL_SHA256_AARCH64: "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
  # wingetcreate (winget job), pinned the same way.
  WINGETCREATE_VERSION: "1.28.1.0"
  WINGETCREATE_SHA256: "63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413"

jobs:
  # ------------------------------------------------------------------------------------------
  # Version, signing decision, update-key sanity check. Only this job and the signing jobs see
  # secrets; no third-party action runs here.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      sign: ${{ steps.meta.outputs.sign }}
      # Environment of the secret-holding jobs: `release` when this run may sign / publish,
      # the secret-free `release-preview` otherwise.
      sign_environment: ${{ steps.meta.outputs.sign == 'true' && 'release' || 'release-preview' }}
      publish_environment: ${{ steps.meta.outputs.publish == 'true' && 'release' || 'release-preview' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve version
        id: meta
        shell: bash
        env:
          # Passed through the environment, never interpolated into the script.
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SIGN_DRY_RUN: ${{ github.event.inputs.sign_dry_run }}
        run: |
          CARGO_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"
          PUBLISH=true
          SIGN=true
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            # Dry run from a release/** branch.
            TAG="v$CARGO_VERSION"
            PUBLISH=false
          else
            TAG="${INPUT_TAG:-$REF_NAME}"
            if [ "$INPUT_DRY_RUN" = "true" ]; then PUBLISH=false; fi
          fi
          if [ "$PUBLISH" = false ]; then
            # Dry runs never sign or notarize (quota, and secrets stay unused), unless asked explicitly.
            SIGN=false
            if [ "$INPUT_SIGN_DRY_RUN" = "true" ]; then SIGN=true; fi
          fi
          VERSION="${TAG#v}"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG does not match workspace version $CARGO_VERSION"
            exit 1
          fi
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "publish=$PUBLISH"
            echo "sign=$SIGN"
          } >> "$GITHUB_OUTPUT"
      - name: Update key sanity check
        # A signing key without a matching committed public key would produce signatures that
        # Lector cannot verify: stop now instead of after a two-hour build. (Only sees the secret
        # when it is a repository secret; scripts/sign-checksums.sh refuses the placeholder key too.)
        shell: bash
        env:
          SIGN: ${{ steps.meta.outputs.sign }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ "$SIGN" = true ] && [ -n "$UPDATE_SIGNING_KEY" ]; then
            if ! grep -v -e '^[[:space:]]*$' -e '^[[:space:]]*#' -e '^untrusted comment:' packaging/update-key.pub | grep -q .; then
              echo "::error::UPDATE_SIGNING_KEY is set but packaging/update-key.pub is still the placeholder. Run scripts/gen-update-key.sh --install-public-key and commit it (docs/RELEASING.md)."
              exit 1
            fi
          fi

  # Third-party crate licenses and a release-notes preview. No secrets.
  meta:
    name: Licenses and notes
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pinned commit; toolchain comes from the `toolchain` input)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: Third-party crate licenses
        run: cargo about generate --workspace about.hbs -o THIRD_PARTY_CRATES.md
      - name: Release notes
        # Preview without signing information (the publish job regenerates them from what the signing jobs recorded).
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-meta
          path: |
            THIRD_PARTY_CRATES.md
            RELEASE_NOTES.md

  # ------------------------------------------------------------------------------------------
  # Linux: build and package without secrets, then sign in a separate job.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: [prepare, meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) keeps the binaries compatible with older distributions.
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            appimagetool_sha256_var: APPIMAGETOOL_SHA256_X86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            appimagetool_sha256_var: APPIMAGETOOL_SHA256_AARCH64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pinned commit; toolchain comes from the `toolchain` input)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dist-${{ matrix.target }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libssl-dev rpm desktop-file-utils
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-meta
          path: target
      - name: Build
        run: cargo build --locked --profile dist -p lector --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          BIN=target/${{ matrix.target }}/dist/lector
          "$BIN" --version | grep -F "${{ needs.prepare.outputs.version }}"
          desktop-file-validate packaging/linux/io.github.meetdhruva.Lector.desktop
      - name: appimagetool
        # A tagged release, verified by SHA-256 before it is made executable.
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_SHA256: ${{ env[matrix.appimagetool_sha256_var] }}
        run: |
          curl -fsSL --retry 3 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          echo "${EXPECTED_SHA256}  appimagetool" | sha256sum --check --strict -
          chmod +x appimagetool
      - name: Package
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
        run: |
          scripts/package-linux.sh target/${{ matrix.target }}/dist/lector \
            "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}" dist
          ls -la dist
      - name: Verify packages
        run: |
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm
          APPIMAGE="$(ls dist/*.AppImage)"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version | grep -F "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Secrets, no downloads: GPG-signs the packages built above (or passes them through unsigned).
  sign-linux:
    name: Sign Linux ${{ matrix.arch }}
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.sign_environment }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-linux-${{ matrix.arch }}
          path: dist
      - name: Signing credentials
        id: signing
        shell: bash
        env:
          ALLOWED: ${{ needs.prepare.outputs.sign }}
          GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          if [ "$ALLOWED" = true ] && [ -n "$GPG_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Linux packages are not GPG-signed (signing disabled for this run or LINUX_GPG_PRIVATE_KEY_BASE64 not set)."
          fi
      - name: Tools for the embedded rpm signature
        # rpmsign from the distribution's own archive (best effort in sign-linux.sh); not a download of third-party binaries.
        if: steps.signing.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Sign packages (GPG)
        if: steps.signing.outputs.enabled == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LECTOR_SIGNING_STATUS: signing-status/linux-${{ matrix.arch }}.txt
        run: |
          scripts/sign-linux.sh dist
          ls -la dist
      - name: Record signing status (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          mkdir -p signing-status
          printf 'platform=linux\nsigned=false\n' > "signing-status/linux-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-linux-${{ matrix.arch }}
          path: signing-status/*.txt
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  # macOS: build the universal binary without secrets; sign, package and notarize in a second job.
  macos:
    name: macOS universal build
    needs: [prepare, meta]
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pinned commit; toolchain comes from the `toolchain` input)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dist-macos-universal
      - name: Build (Apple Silicon)
        run: cargo build --locked --profile dist -p lector --target aarch64-apple-darwin
      - name: Build (Intel)
        run: cargo build --locked --profile dist -p lector --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/lector \
            target/aarch64-apple-darwin/dist/lector target/x86_64-apple-darwin/dist/lector
          lipo -info target/universal/lector
          target/universal/lector --version | grep -F "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-universal-binary
          path: target/universal/lector
          if-no-files-found: error

  # Secrets, no downloads: bundle, sign, notarize, staple and verify (or package unsigned).
  macos-package:
    name: macOS package and sign
    needs: [prepare, macos]
    runs-on: macos-latest
    timeout-minutes: 90
    environment: ${{ needs.prepare.outputs.sign_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-universal-binary
          path: target/universal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-meta
          path: target
      - name: Restore executable bit
        run: chmod +x target/universal/lector
      - name: Signing credentials
        id: signing
        shell: bash
        env:
          ALLOWED: ${{ needs.prepare.outputs.sign }}
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          sign=false
          notarize=false
          if [ "$ALLOWED" = true ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            sign=true
            if [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then notarize=true; fi
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          if [ "$sign" != true ]; then
            echo "::notice::macOS build is not Developer ID signed (signing disabled for this run or certificate secrets not set)."
          elif [ "$notarize" != true ]; then
            echo "::warning::macOS build is signed but NOT notarized (APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID are not all set)."
          fi
      - name: Import signing certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/sign-macos.sh setup
      - name: Package
        env:
          LECTOR_MACOS_SIGN: ${{ steps.signing.outputs.sign == 'true' && '1' || '0' }}
          LECTOR_MACOS_NOTARIZE: ${{ steps.signing.outputs.notarize == 'true' && '1' || '0' }}
          LECTOR_SIGNING_STATUS: signing-status/macos.txt
        run: |
          scripts/package-macos.sh target/universal/lector "${{ needs.prepare.outputs.version }}" universal dist
          ls -la dist
      - name: Verify signed artifacts
        # Checks what users actually get: the app inside the .zip and the .dmg, not the intermediate files.
        if: steps.signing.outputs.sign == 'true'
        env:
          VERIFY_MODE: ${{ steps.signing.outputs.notarize == 'true' && 'notarized' || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          check="$RUNNER_TEMP/verify"
          rm -rf "$check"; mkdir -p "$check/zip" "$check/dmg"
          ditto -x -k "dist/Lector-$VERSION-macos-universal.zip" "$check/zip"
          scripts/sign-macos.sh verify "$check/zip/Lector.app" "$VERIFY_MODE"
          hdiutil attach -nobrowse -readonly -mountpoint "$check/dmg" "dist/Lector-$VERSION-macos-universal.dmg"
          scripts/sign-macos.sh verify "$check/dmg/Lector.app" "$VERIFY_MODE"
          hdiutil detach "$check/dmg"
          scripts/sign-macos.sh verify "dist/Lector-$VERSION-macos-universal.dmg" "$VERIFY_MODE"
      - name: Remove signing material
        if: always() && steps.signing.outputs.sign == 'true'
        run: scripts/sign-macos.sh cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-macos-universal
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-macos
          path: signing-status/macos.txt
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  # Windows: build (no secrets) → sign the binaries (secrets) → package with the installer tools
  # (downloads, no secrets) → sign the installers (secrets). The binaries are signed before packaging
  # so the portable zip, the installer and the MSI all contain signed binaries.
  windows:
    name: Windows ${{ matrix.arch }} build
    needs: [prepare, meta]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          # Cross-compiled on the x64 runner (MSVC ships the ARM64 toolset).
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pinned commit; toolchain comes from the `toolchain` input)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dist-${{ matrix.target }}
      # lector.exe is a GUI-subsystem app (no console); lector-cli.exe is the console build of the
      # command line (no GUI dependencies) that the packages ship as lector-cli.exe and lector.com.
      - name: Build
        run: cargo build --locked --profile dist -p lector -p lector-cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $out = (& "target\${{ matrix.target }}\dist\lector.exe" --version | Out-String)
          Write-Host $out
          if ($out -notmatch [regex]::Escape("${{ needs.prepare.outputs.version }}")) { throw "unexpected version output" }
          $cli = (& "target\${{ matrix.target }}\dist\lector-cli.exe" --version | Out-String)
          Write-Host $cli
          if ($cli -notmatch [regex]::Escape("${{ needs.prepare.outputs.version }}")) { throw "unexpected lector-cli version output" }
          $status = (& "target\${{ matrix.target }}\dist\lector-cli.exe" status . --json | Out-String)
          if ($status -notmatch '"schema"') { throw "lector-cli status produced no JSON" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bin-built-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/dist/lector.exe
            target/${{ matrix.target }}/dist/lector-cli.exe
          if-no-files-found: error

  sign-windows-binaries:
    name: Sign Windows ${{ matrix.arch }} binaries
    needs: [prepare, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.sign_environment }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-bin-built-${{ matrix.arch }}
          path: bin
      - name: Signing credentials
        id: signing
        shell: bash
        env:
          ALLOWED: ${{ needs.prepare.outputs.sign }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          provider=none
          if [ "$ALLOWED" = true ]; then
            if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
               && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ]; then
              provider=azure
            elif [ -n "$PFX" ] && [ -n "$PFX_PASSWORD" ]; then
              provider=pfx
            fi
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          if [ "$provider" = none ]; then
            echo "::notice::Windows binaries and installers are not Authenticode-signed (signing disabled for this run or no signing secrets set)."
          fi
      - name: Sign binaries
        # lector.com is a byte-for-byte copy of the signed lector-cli.exe (made by the packaging script).
        if: steps.signing.outputs.provider != 'none'
        shell: pwsh
        env:
          SIGN_PROVIDER: ${{ steps.signing.outputs.provider }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          ARTIFACT_SIGNING_CLIENT_SHA256: ${{ vars.ARTIFACT_SIGNING_CLIENT_SHA256 }}
        run: |
          & scripts/sign-windows.ps1 -Files @("bin\lector.exe", "bin\lector-cli.exe")
      - name: Verify binary signatures
        if: steps.signing.outputs.provider != 'none'
        shell: pwsh
        run: |
          & scripts/sign-windows.ps1 -Files @("bin\lector.exe", "bin\lector-cli.exe") -Verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bin-${{ matrix.arch }}
          path: bin/*.exe
          if-no-files-found: error
      - name: Record signing provider
        shell: bash
        env:
          PROVIDER: ${{ steps.signing.outputs.provider }}
        run: |
          mkdir -p provider
          printf '%s' "$PROVIDER" > provider/provider.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-provider-${{ matrix.arch }}
          path: provider/provider.txt
          if-no-files-found: error

  # Installer tools are third-party downloads (choco, dotnet tool): no secrets here.
  windows-package:
    name: Windows ${{ matrix.arch }} installers
    needs: [prepare, meta, sign-windows-binaries]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-meta
          path: target
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-bin-${{ matrix.arch }}
          path: bin
      - name: Installer tools
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package
        shell: pwsh
        run: |
          pwsh scripts/package-windows.ps1 -Binary "bin\lector.exe" `
            -CliBinary "bin\lector-cli.exe" `
            -Version "${{ needs.prepare.outputs.version }}" -Arch ${{ matrix.arch }} -OutDir dist
          Get-ChildItem dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  sign-windows-installers:
    name: Sign Windows ${{ matrix.arch }} installers
    needs: [prepare, windows-package, sign-windows-binaries]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.sign_environment }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-bin-${{ matrix.arch }}
          path: bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-provider-${{ matrix.arch }}
          path: provider
      - name: Signing provider
        # Decided by the binary-signing job; the credentials are mapped again below.
        id: signing
        shell: bash
        run: echo "provider=$(cat provider/provider.txt)" >> "$GITHUB_OUTPUT"
      - name: Sign installers
        if: steps.signing.outputs.provider != 'none'
        shell: pwsh
        env:
          SIGN_PROVIDER: ${{ steps.signing.outputs.provider }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          ARTIFACT_SIGNING_CLIENT_SHA256: ${{ vars.ARTIFACT_SIGNING_CLIENT_SHA256 }}
        run: |
          $installers = @(Get-ChildItem dist -File | Where-Object { $_.Name -like "*-setup.exe" -or $_.Name -like "*.msi" } | ForEach-Object { $_.FullName })
          if ($installers.Count -lt 2) { throw "expected a setup.exe and an .msi in dist, found $($installers.Count) installer(s)" }
          & scripts/sign-windows.ps1 -Files $installers
      - name: Verify signatures
        if: steps.signing.outputs.provider != 'none'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -like "*-setup.exe" -or $_.Name -like "*.msi" } | ForEach-Object { $_.FullName })
          $files += "bin\lector.exe"
          $files += "bin\lector-cli.exe"
          & scripts/sign-windows.ps1 -Files $files -Verify
      - name: Record signing status
        shell: bash
        env:
          PROVIDER: ${{ steps.signing.outputs.provider }}
        run: |
          mkdir -p signing-status
          if [ "$PROVIDER" = none ]; then
            printf 'platform=windows\nsigned=false\n' > "signing-status/windows-${{ matrix.arch }}.txt"
          else
            printf 'platform=windows\nsigned=true\nprovider=%s\n' "$PROVIDER" > "signing-status/windows-${{ matrix.arch }}.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-windows-${{ matrix.arch }}
          path: signing-status/*.txt
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------
  # Checksums and package-manager manifests. No secrets. Runs in dry runs too, so a release/**
  # branch exercises checksum and manifest generation.
  checksums:
    name: Checksums and manifests
    needs: [prepare, sign-linux, macos-package, sign-windows-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signing-*
          path: signing
          merge-multiple: true
      - name: Package-manager manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          notarized=""
          if grep -qx 'notarized=true' signing/macos.txt; then notarized="--notarized"; fi
          scripts/gen-package-manifests.sh "$VERSION" dist manifests --require-all $notarized
          cp manifests/lector.rb manifests/io.github.meetdhruva.Lector.yml "manifests/Lector-$VERSION-winget-manifests.zip" dist/
      - name: Checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # `dist-*` is merged into the release files by the publish job.
          name: dist-extra
          path: |
            dist/SHA256SUMS.txt
            dist/lector.rb
            dist/io.github.meetdhruva.Lector.yml
            dist/*-winget-manifests.zip
          if-no-files-found: error

  # Secrets, no downloads: minisign signature of SHA256SUMS.txt (the file Lector verifies updates against).
  sign-checksums:
    name: Sign checksums
    needs: [prepare, checksums]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.sign_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-extra
          path: dist
      - name: Signing credentials
        id: signing
        env:
          ALLOWED: ${{ needs.prepare.outputs.sign }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ "$ALLOWED" = true ] && [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SHA256SUMS.txt is not signed (signing disabled for this run or UPDATE_SIGNING_KEY not set); Lector will not report downloads as verified."
          fi
      - name: Sign SHA256SUMS.txt (minisign)
        if: steps.signing.outputs.enabled == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LECTOR_SIGNING_STATUS: signing/checksums.txt
        run: |
          # minisign comes from the distribution's archive.
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v | head -n 1
          scripts/sign-checksums.sh "$TAG" dist
      - name: Record checksum signing status (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          mkdir -p signing
          printf 'platform=checksums\nsigned=false\n' > signing/checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-checksums
          path: signing/checksums.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-checksum-signature
          path: dist/SHA256SUMS.txt.minisig
          if-no-files-found: ignore

  # The release itself (or the dry-run preview). Holds write access to this repository and the
  # package-manager tokens; runs the pinned release action and nothing else third-party.
  publish:
    name: Publish
    needs: [prepare, checksums, sign-checksums]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.publish_environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signing-*
          path: signing
          merge-multiple: true
      - name: Release files
        run: ls -la dist
      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" --signing-dir signing > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Dry run preview
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preview
          path: |
            dist/SHA256SUMS.txt*
            dist/lector.rb
            dist/io.github.meetdhruva.Lector.yml
            dist/*-winget-manifests.zip
            RELEASE_NOTES.md
          if-no-files-found: error
      - name: Publish release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lector ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: dist/*
      - name: Homebrew tap
        # Only with a token (HOMEBREW_TAP_TOKEN: contents write on meetdhruva/homebrew-tap), only for
        # final, non-draft releases. Without the secret this step does nothing.
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease != 'true' && github.event.inputs.draft != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set: lector.rb is attached to the release but the tap was not updated."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=Authorization: Basic $auth" clone --depth 1 https://github.com/meetdhruva/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp dist/lector.rb tap/Casks/lector.rb
          cd tap || exit 1
          git add Casks/lector.rb
          if git diff --cached --quiet; then
            echo "tap already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "lector $VERSION"
          git -c "http.extraheader=Authorization: Basic $auth" push origin HEAD

  # Optional: opens a pull request on microsoft/winget-pkgs for the new version. Needs WINGET_TOKEN
  # (a classic personal access token with public_repo) and a first manifest already accepted in
  # winget-pkgs (docs/RELEASING.md, "winget"). Without the secret the job only prints a notice.
  # wingetcreate is a pinned release (WINGETCREATE_VERSION) verified by SHA-256, not `aka.ms/latest`.
  winget:
    name: winget submission
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease != 'true' && github.event.inputs.draft != 'true'
    runs-on: windows-latest
    environment: ${{ needs.prepare.outputs.publish_environment }}
    steps:
      - name: Submit with wingetcreate
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::notice::WINGET_TOKEN not set: winget manifests are attached to the release but no pull request was opened."
            return
          }
          Write-Host "::add-mask::$($env:WINGET_TOKEN)"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/microsoft/winget-create/releases/download/v$($env:WINGETCREATE_VERSION)/wingetcreate.exe" -OutFile wingetcreate.exe
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath wingetcreate.exe).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe does not match the pinned SHA-256 (got $actual)" }
          $base = "https://github.com/meetdhruva/lector/releases/download/v$($env:VERSION)"
          .\wingetcreate.exe update meetdhruva.Lector --version $env:VERSION `
            --urls "$base/Lector-$($env:VERSION)-windows-x64-setup.exe|x64" "$base/Lector-$($env:VERSION)-windows-arm64-setup.exe|arm64" `
            --submit --token $env:WINGET_TOKEN
