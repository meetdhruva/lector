name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

env:
  # Pinned compiler: bump deliberately and fix new clippy lints in the same commit.
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libssl-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        timeout-minutes: 30
        run: cargo test --workspace --no-fail-fast
      - name: Build release binary
        run: cargo build --release -p lector
      - uses: actions/upload-artifact@v4
        with:
          name: lector-${{ runner.os }}
          path: |
            target/release/lector
            target/release/lector.exe
          if-no-files-found: ignore
