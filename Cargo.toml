[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/xattr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meetdhruva/lector"
authors = ["Lector contributors"]

[workspace.dependencies]
# internal
lector-text = { path = "crates/lector-text" }
lector-syntax = { path = "crates/lector-syntax" }
lector-diff = { path = "crates/lector-diff" }
lector-git = { path = "crates/lector-git" }
lector-search = { path = "crates/lector-search" }
lector-lsp = { path = "crates/lector-lsp" }
lector-fs = { path = "crates/lector-fs" }
lector-config = { path = "crates/lector-config" }
lector-theme = { path = "crates/lector-theme" }
lector-icons = { path = "crates/lector-icons" }
lector-workspace = { path = "crates/lector-workspace" }
lector-ui = { path = "crates/lector-ui" }
# common
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
smallvec = { version = "1", features = ["union", "const_generics"] }
arrayvec = "0.7"
crossbeam-channel = "0.5"
once_cell = "1"
regex = "1"
memchr = "2"
memmap2 = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
dirs = "6"
globset = "0.4"
rayon = "1"
# dev
insta = "1"
proptest = "1"
tempfile = "3"
criterion = { version = "0.7", default-features = false }

[patch.crates-io]
# libc >= 0.2.18x removed ENOATTR on Linux; gpui -> zed-async-tar -> xattr 0.2 still uses it.
xattr = { path = "vendor/xattr" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
