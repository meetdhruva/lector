# Crate layering (ADR 0001, 0002, 0008), checked by `arch-check deps`.
#
# Layers run from the bottom (0) to the top. A crate may depend (normal or build dependency;
# dev-dependencies are ignored) only on crates in LOWER layers; an edge inside one layer must be
# listed under [[same_layer]]. Every workspace crate must be placed here.
#
# The order below was derived from the real graph at 0.7.1 by placing each crate as low as its
# dependencies allow, so today's tree passes. Do not move a crate up to make an edge legal: that is
# the violation. Crates that do not exist yet (lector-base, lector-review) are placed where the
# ADRs put them; they are ignored until they appear.
#
# Target rules that the tree does not meet yet are written as [[forbid]] / [[forbid_crate]] entries
# and baselined in arch/baseline.toml; each consolidation step ends with its entries removed.

[[layer]]
name = "base"
# Future (ADR 0005): CancelToken, fuzzy matcher, named threads. Depends on nothing but std.
crates = ["lector-base"]

[[layer]]
name = "leaf"
# No internal dependencies. lector-archcheck (this checker) is a dev tool and lives here too.
crates = [
  "lector-archcheck",
  "lector-config",
  "lector-diff",
  "lector-forge",
  "lector-icons",
  "lector-process",
  "lector-search",
  "lector-terminal",
  "lector-text",
  "lector-theme",
]

[[layer]]
name = "service"
# Single-purpose services built on the leaves.
crates = [
  "lector-buffer",
  "lector-fs",
  "lector-git",
  "lector-lsp",
  "lector-syntax",
]

[[layer]]
name = "analysis"
# Below the stateful app. lector-review is the stateless review analysis (ADR 0001);
# lector-perf is a dev-only gate runner.
crates = ["lector-perf", "lector-review"]

[[layer]]
name = "app"
# The only stateful layer (ADR 0001).
crates = ["lector-app"]

[[layer]]
name = "client"
# Consumers of lector-app: the agent runtime, the MCP server and the GPUI shell.
crates = ["lector-agent", "lector-mcp", "lector-ui"]

[[layer]]
name = "frontend"
crates = ["lector-cli", "lector-ui-git", "lector-ui-terminal"]

[[layer]]
name = "ui-agent"
crates = ["lector-ui-agent"]

[[layer]]
name = "binary"
crates = ["lector"]

# ---- target rules, baselined until the consolidation steps land ----

[[forbid]]
from = "lector-ui*"
to = "lector-process"
adr = "0002"
reason = "UI crates never spawn processes or depend on lector-process; lector-app commands do"

[[forbid_crate]]
name = "lector-workspace"
adr = "0001"
reason = "split into the stateless lector-review and the stateful lector-app; no shim is left behind"

# lector-review depends on no stateful crate (ADR 0001).
[[forbid]]
from = "lector-review"
to = "lector-app"
adr = "0001"
reason = "lector-review is stateless and sits below lector-app"

[[forbid]]
from = "lector-review"
to = "lector-agent"
adr = "0001"
reason = "lector-review is stateless and sits below lector-app"

[[forbid]]
from = "lector-review"
to = "lector-ui*"
adr = "0001"
reason = "lector-review is stateless and sits below lector-app"

[[forbid]]
from = "lector-review"
to = "lector-workspace"
adr = "0001"
reason = "lector-workspace is removed; lector-review replaces its analysis"

# ---- dependency closures (ADR 0008) ----

[closure]
# Only these may reach GUI, window-system or async-runtime crates; every other crate is core.
gui_crates = ["lector", "lector-ui*"]
forbidden = [
  "gpui*",
  "tokio",
  "winit",
  "wayland-client",
  "wayland-protocols*",
  "x11rb*",
  "x11-dl",
  "xcb",
  "xkbcommon*",
  "raw-window-handle",
  "cocoa",
  "objc2-app-kit",
  "blade-graphics",
  "wgpu*",
  "smithay-client-toolkit",
  "ashpd",
]
# The headless CLI and MCP server ship as a console binary (docs/RELEASING.md).
headless = ["lector-cli", "lector-mcp"]
headless_forbidden = ["gpui*"]
