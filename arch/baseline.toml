# Architecture ratchet baseline (see arch/README.md and docs/adr/0008-guardrails.md).
#
# rule -> key -> count. Keys are files, except `deps` (crate edges) and `size` (file -> lines).
# Numbers may only go down. Never raise one: fix the code, or write an ADR.
# Lower entries with `scripts/arch-check --update`, which refuses to raise anything.

[deps]

[writes]
"crates/lector-agent/src/session.rs" = 4
"crates/lector-app/src/git_service.rs" = 1
"crates/lector-app/src/journal/undo.rs" = 5
"crates/lector-app/src/project.rs" = 1
"crates/lector-app/src/review_service/apply.rs" = 1
"crates/lector-cli/src/journal.rs" = 1
"crates/lector-ui-git/src/activity.rs" = 1
"crates/lector-ui-git/src/store.rs" = 1
"crates/lector-ui/src/settings.rs" = 2
"crates/lector-ui/src/views/workspace/chrome.rs" = 1

[threads]

[background]

[state]

[dupes]
"crates/lector-fs/src/watch.rs" = 1

[size]

[purity]

[hygiene]
"crates/lector-perf/src/bin/gate_buffer.rs [forbid_unsafe_code]" = 1
"crates/lector-perf/src/bin/gate_diff.rs [forbid_unsafe_code]" = 1
