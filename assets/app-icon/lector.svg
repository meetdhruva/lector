<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C6EF5"/>
      <stop offset="1" stop-color="#1E2A6E"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1240" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS-style squircle with margin -->
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <!-- page -->
  <g filter="url(#shadow)">
    <rect x="236" y="212" width="552" height="600" rx="56" fill="url(#page)"/>
  </g>
  <!-- gutter markers -->
  <rect x="284" y="300" width="14" height="56" rx="7" fill="#2FB344"/>
  <rect x="284" y="396" width="14" height="56" rx="7" fill="#2FB344"/>
  <rect x="284" y="588" width="14" height="56" rx="7" fill="#E8590C"/>
  <!-- code lines -->
  <rect x="332" y="308" width="300" height="40" rx="20" fill="#364FC7"/>
  <rect x="380" y="404" width="324" height="40" rx="20" fill="#748FFC"/>
  <rect x="380" y="500" width="232" height="40" rx="20" fill="#A5B4FC"/>
  <rect x="332" y="596" width="268" height="40" rx="20" fill="#364FC7" fill-opacity="0.55"/>
  <rect x="332" y="692" width="180" height="40" rx="20" fill="#A5B4FC"/>
</svg>
