# Package manifest
[package]
name = "lector"
version = "0.1.0"
edition = "2021"
authors = ["A <a@example.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = "1.0"

[[bin]]
name = "lector"
path = "src/main.rs"

[profile.dev]
opt-level = 1
debug = true
ratio = 0.5
when = 1979-05-27T07:32:00Z
