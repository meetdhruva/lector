[package]
name = "lector-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPUI application shell, views and widget kit for Lector."

[dependencies]
gpui = "0.2.2"
lector-theme.workspace = true
lector-icons.workspace = true
anyhow.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
tracing.workspace = true
lector-config.workspace = true
lector-workspace.workspace = true
lector-search.workspace = true
lector-fs.workspace = true
lector-syntax.workspace = true
lector-text.workspace = true
lector-git.workspace = true
lector-diff.workspace = true
lector-lsp.workspace = true
lector-buffer.workspace = true
parking_lot.workspace = true
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
dunce.workspace = true
tempfile.workspace = true
gpui = { version = "0.2.2", features = ["test-support"] }

[features]
test-support = ["gpui/test-support"]
