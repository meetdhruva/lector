[package]
name = "lector-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stateless review analysis for Lector: changesets, file diffs, risk, structural diff, conflicts."

[dependencies]
memchr.workspace = true
regex.workspace = true
lector-text.workspace = true
lector-fs.workspace = true
lector-syntax.workspace = true
lector-diff.workspace = true
lector-git.workspace = true
lector-base.workspace = true
lector-config.workspace = true
lector-buffer.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[dev-dependencies]
lector-config = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "algo_bench"
harness = false

[[bench]]
name = "structural_bench"
harness = false
