[package]
name = "lector-ui-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPUI terminal view and panel for Lector."

[dependencies]
gpui = "0.2.2"
lector-ui.workspace = true
lector-app.workspace = true
lector-terminal.workspace = true
lector-config.workspace = true
lector-theme.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The background bridge runs view jobs on GPUI's test executor only with this feature; without
# it they run on real scheduler threads and `run_until_parked` does not wait for them.
lector-ui = { workspace = true, features = ["test-support"] }
dunce.workspace = true
lector-config = { workspace = true, features = ["test-support"] }
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile.workspace = true
