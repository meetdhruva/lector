[package]
name = "lector-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "UI-free terminal sessions for Lector: PTY, VT emulation, scrollback, damage tracking, shell integration."

[dependencies]
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
memchr.workspace = true
alacritty_terminal = { version = "0.26.0", default-features = false }
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "system"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
insta.workspace = true

[[bench]]
name = "parse_throughput"
harness = false
