[package]
name = "lector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A fast, reading-first code viewer and git review tool."
homepage = "https://github.com/meetdhruva/lector"
readme = "../../README.md"
keywords = ["editor", "code-viewer", "git", "code-review", "gui"]
categories = ["development-tools", "text-editors"]
build = "build.rs"

[[bin]]
name = "lector"
path = "src/main.rs"

[dependencies]
dunce.workspace = true
lector-ui.workspace = true
lector-ui-git.workspace = true
lector-ui-agent.workspace = true
lector-ui-terminal.workspace = true
lector-theme.workspace = true
lector-workspace.workspace = true
lector-config.workspace = true
lector-cli.workspace = true
lector-app.workspace = true
lector-process.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
futures = "0.3"
url = "2"

[dev-dependencies]
lector-config = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
