[package]
name = "lector-fs"
description = "File loading, kind/encoding detection and a debounced file watcher for Lector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lector-base.workspace = true
dunce.workspace = true
lector-text.workspace = true
thiserror.workspace = true
encoding_rs = "0.8"
notify = "8.2"

# No-follow opens for confined reads and writes (`confine`): openat/mkdirat/renameat.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
