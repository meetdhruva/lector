[package]
name = "lector-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless application core of Lector: documents, git state, commands, scheduler, activity journal, storage."

[dependencies]
lector-base.workspace = true
lector-text = { workspace = true, features = ["serde"] }
lector-buffer.workspace = true
lector-fs.workspace = true
lector-syntax.workspace = true
lector-diff.workspace = true
lector-git = { workspace = true, features = ["serde"] }
lector-process.workspace = true
lector-search.workspace = true
lector-lsp.workspace = true
lector-config.workspace = true
lector-review.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
futures = "0.3"
redb = "4.5"
sha2 = "0.10"
num_cpus = "1"
dunce.workspace = true

# The health probe asks whether a folder is writable without creating anything in it.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
lector-config = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "cache_bench"
harness = false
