# cargo-about configuration: generates THIRD_PARTY_CRATES.md shipped in every release artifact.
#   cargo about generate --workspace about.hbs -o target/THIRD_PARTY_CRATES.md
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "MIT-0",
  "OFL-1.1",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "NCSA",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
